{% extends 'base.html' %}
{% block title %}Register – SafeGuard Insurance{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus" style="font-size:2.5rem;color:#1a3c5e"></i>
        <h3 class="mt-2 fw-bold">Create an Account</h3>
        <p class="text-muted">Join SafeGuard Insurance today</p>
      </div>
      <form method="POST">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
            <input type="text" name="first_name" class="form-control" placeholder="John" required/>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
            <input type="text" name="last_name" class="form-control" placeholder="Doe" required/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Phone Number</label>
          <input type="text" name="phone" class="form-control" placeholder="204-555-0000"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Date of Birth</label>
          <input type="date" name="date_of_birth" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Min. 8 characters" required/>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
          <input type="password" name="confirm_password" id="confirm" class="form-control" placeholder="Repeat password" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
      </form>
      <hr/>
      <p class="text-center mb-0">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
