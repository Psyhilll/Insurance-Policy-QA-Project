name: SafeGuard Insurance – QA Automation Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  qa-automation:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Checkout code ──────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ──────────────────────────────────────────────
      - name: 🐍 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Step 3: Install app dependencies ──────────────────────────────────
      - name: 📦 Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask Flask-SQLAlchemy Werkzeug

      # ── Step 4: Start Flask app in background ─────────────────────────────
      - name: 🚀 Start Flask Application
        run: |
          cd Application
          python app.py &
          echo "Waiting for app to start..."
          sleep 5
        env:
          FLASK_ENV: testing

      # ── Step 5: Verify app is running ─────────────────────────────────────
      - name: ✅ Verify App is Running
        run: |
          curl --retry 5 --retry-delay 2 --retry-connrefused \
               http://localhost:5000/login \
               -o /dev/null -w "%{http_code}" | grep -q "200"
          echo "✅ App is up and running"

      # ── Step 6: Install automation dependencies ───────────────────────────
      - name: 📦 Install Automation Dependencies
        run: |
          pip install pytest playwright pytest-html pytest-playwright
          playwright install chromium --with-deps

      # ── Step 7: Create test user via API ──────────────────────────────────
      - name: 👤 Create Test User
        run: |
          curl -s -X POST http://localhost:5000/api/register \
            -H "Content-Type: application/json" \
            -d '{
              "first_name": "Playwright",
              "last_name":  "Tester",
              "email":      "playwright@test.com",
              "password":   "Test@1234",
              "phone":      "204-555-0000"
            }' | python3 -c "import sys,json; d=json.load(sys.stdin); print('User created:', d)"

      # ── Step 8: Run Playwright tests ──────────────────────────────────────
      - name: 🧪 Run Playwright Tests
        run: |
          cd Automation
          pytest tests/ \
            --html=reports/test_report.html \
            --self-contained-html \
            -v \
            --tb=short
        continue-on-error: true   # don't fail pipeline on test failures

      # ── Step 9: Upload HTML report as artifact ────────────────────────────
      - name: 📊 Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-report
          path: Automation/reports/test_report.html
          retention-days: 30

      # ── Step 10: Upload screenshots ───────────────────────────────────────
      - name: 📸 Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: Automation/screenshots/
          retention-days: 30

      # ── Step 11: Print summary ────────────────────────────────────────────
      - name: 📋 Print Test Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  SafeGuard Insurance – QA Pipeline Done "
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📁 Test report uploaded as artifact"
          echo "📸 Screenshots uploaded as artifact"
          echo "🔗 Download from GitHub Actions > Artifacts"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
